name: grid_coverage_generalization_4x4_train50_2hop_30

# Five distinct 50%-coverage masks contribute equal junction/action samples.
cities:
  - name: coverage_generalization_grid_4x4_train_signals_06_of_12_mask_01
    split: train
    sumo_config: configs/grid_generalization/coverage_generalization_grid_4x4_train_signals_06_of_12_mask_01/grid.sumocfg
    rollout_jobs_per_iteration: 18
  - name: coverage_generalization_grid_4x4_train_signals_06_of_12_mask_02
    split: train
    sumo_config: configs/grid_generalization/coverage_generalization_grid_4x4_train_signals_06_of_12_mask_02/grid.sumocfg
    rollout_jobs_per_iteration: 18
  - name: coverage_generalization_grid_4x4_train_signals_06_of_12_mask_03
    split: train
    sumo_config: configs/grid_generalization/coverage_generalization_grid_4x4_train_signals_06_of_12_mask_03/grid.sumocfg
    rollout_jobs_per_iteration: 18
  - name: coverage_generalization_grid_4x4_train_signals_06_of_12_mask_04
    split: train
    sumo_config: configs/grid_generalization/coverage_generalization_grid_4x4_train_signals_06_of_12_mask_04/grid.sumocfg
    rollout_jobs_per_iteration: 18
  - name: coverage_generalization_grid_4x4_train_signals_06_of_12_mask_05
    split: train
    sumo_config: configs/grid_generalization/coverage_generalization_grid_4x4_train_signals_06_of_12_mask_05/grid.sumocfg
    rollout_jobs_per_iteration: 18
  - name: coverage_generalization_grid_4x4_validation_signals_06_of_12_mask_01
    split: held_out
    sumo_config: configs/grid_generalization/coverage_generalization_grid_4x4_validation_signals_06_of_12_mask_01/grid.sumocfg
    rollout_jobs_per_iteration: 0

simulation:
  decision_interval: 5
  time_to_teleport: -1
  yellow_duration: 3
  yellow_start_delay: 0
  min_green_steps: 1
  initial_occupancy_min: 0.06
  initial_occupancy_max: 0.08
  warmup_steps: 15

demand:
  train_scale_min: 0.6
  train_scale_max: 0.8
  eval_scales: [0.7]

imitation_learning:
  samples_per_city: 9600
  samples_per_simulation: 80
  collection_workers: 4
  epochs: 20
  samples_per_batch: 128
  phase_loss_coefficient: 1.0

ppo:
  iterations: 30
  steps_per_rollout: 200
  rollouts_per_update: 90
  rollout_workers: 32
  update_epochs: 4
  value_warmup_iterations: 0
  warmup_epochs: 4
  transitions_per_batch: 2048
  action_samples_per_batch: 16384
  update_batch_workers: 0
  reward_sample_interval: 5
  reward_mode: throughput
  reward_objective: maximize
  global_reward_weight: 0.0
  flow_reward_weight: 0.0
  throughput_reward_weight: 0.0
  progress_reward_weight: 1.0
  discharge_reward_weight: 10.0
  gridlock_penalty_weight: 0.02
  speed_change_weight: 10.0
  speed_change_mode: braking
  switch_penalty_weight: 0.0
  entropy_coefficient: 0.001
  eval_every_iterations: 10
  eval_workers: 32
  eval_learned_device: cpu
  eval_learned_action_mode: sample
  eval_learned_temperature: 1.0
  save_every_iterations: 1

evaluation:
  policies: [learned, learned-greedy, max-pressure]
  seeds: [4401, 4402, 4403]
  steps: 1800
  fixed_time_phase_duration: 10
  queue_pressure_phase_duration: 10
