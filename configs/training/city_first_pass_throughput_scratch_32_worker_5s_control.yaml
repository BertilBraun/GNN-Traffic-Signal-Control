name: city_first_pass_throughput_scratch_32_worker_5s_control

cities:
  - name: karlsruhe_oststadt
    split: train
    sumo_config: configs/karlsruhe_oststadt/karlsruhe_oststadt.sumocfg
    build_config: configs/karlsruhe_oststadt/karlsruhe_oststadt.build.yaml
    rollout_jobs_per_iteration: 10
    rollout_priority: 2
  - name: mannheim_innenstadt
    split: train
    sumo_config: configs/mannheim_innenstadt/mannheim_innenstadt.sumocfg
    build_config: configs/mannheim_innenstadt/mannheim_innenstadt.build.yaml
    rollout_jobs_per_iteration: 10
    rollout_priority: 4
    train_scale_min: 0.8
    train_scale_max: 1.05
  - name: stuttgart_mitte
    split: train
    sumo_config: configs/stuttgart_mitte/stuttgart_mitte.sumocfg
    build_config: configs/stuttgart_mitte/stuttgart_mitte.build.yaml
    rollout_jobs_per_iteration: 10
    rollout_priority: 5
    train_scale_min: 0.8
    train_scale_max: 1.05
  - name: heidelberg_bergheim
    split: train
    sumo_config: configs/heidelberg_bergheim/heidelberg_bergheim.sumocfg
    build_config: configs/heidelberg_bergheim/heidelberg_bergheim.build.yaml
    rollout_jobs_per_iteration: 10
    rollout_priority: 3
  - name: freiburg_altstadt
    split: held_out
    sumo_config: configs/freiburg_altstadt/freiburg_altstadt.sumocfg
    build_config: configs/freiburg_altstadt/freiburg_altstadt.build.yaml
    rollout_jobs_per_iteration: 0
    rollout_priority: 0

simulation:
  decision_interval: 5
  time_to_teleport: -1
  yellow_duration: 3
  yellow_start_delay: 2
  min_green_steps: 1
  initial_occupancy_min: 0.05
  initial_occupancy_max: 0.08

demand:
  train_scale_min: 0.8
  train_scale_max: 1.2
  eval_scales: [1.0]

imitation_learning:
  samples_per_city: 9600
  samples_per_simulation: 80
  collection_workers: 4
  epochs: 20
  samples_per_batch: 128
  phase_loss_coefficient: 1.0

ppo:
  iterations: 1000
  steps_per_rollout: 500
  rollouts_per_update: 40
  rollout_workers: 32
  update_epochs: 2
  value_warmup_iterations: 0
  warmup_epochs: 2
  transitions_per_batch: 2048
  update_batch_workers: 0
  reward_sample_interval: 5
  reward_mode: throughput
  global_reward_weight: 0.2
  flow_reward_weight: 0.0
  throughput_reward_weight: 1.0
  progress_reward_weight: 0.25
  gridlock_penalty_weight: 0.08
  speed_change_weight: 0.005
  eval_every_iterations: 5
  eval_workers: 32
  eval_learned_device: cpu
  eval_learned_action_mode: sample
  eval_learned_temperature: 1.0
  save_every_iterations: 1

evaluation:
  policies: [learned, max-pressure, queue, uniform-random, fixed-time]
  seeds: [100, 101, 102, 103, 104, 105]
  steps: 1800
  fixed_time_phase_duration: 10
