name: grid_signal_coverage_6x6_evaluation

cities:
  - name: coverage_grid_6x6_eligible_signals_32_of_32
    split: train
    sumo_config: configs/grid_generalization/coverage_grid_6x6_eligible_signals_32_of_32/grid.sumocfg
    rollout_jobs_per_iteration: 0
  - name: coverage_grid_6x6_eligible_signals_24_of_32
    split: evaluation_only
    sumo_config: configs/grid_generalization/coverage_grid_6x6_eligible_signals_24_of_32/grid.sumocfg
    rollout_jobs_per_iteration: 0
  - name: coverage_grid_6x6_eligible_signals_16_of_32
    split: evaluation_only
    sumo_config: configs/grid_generalization/coverage_grid_6x6_eligible_signals_16_of_32/grid.sumocfg
    rollout_jobs_per_iteration: 0
  - name: coverage_grid_6x6_eligible_signals_08_of_32
    split: evaluation_only
    sumo_config: configs/grid_generalization/coverage_grid_6x6_eligible_signals_08_of_32/grid.sumocfg
    rollout_jobs_per_iteration: 0

simulation:
  decision_interval: 5
  time_to_teleport: -1
  yellow_duration: 3
  yellow_start_delay: 0
  min_green_steps: 1
  initial_occupancy_min: 0.06
  initial_occupancy_max: 0.08
  warmup_steps: 15

demand:
  train_scale_min: 0.6
  train_scale_max: 0.8
  eval_scales: [0.7]

imitation_learning:
  samples_per_city: 9600
  samples_per_simulation: 80
  collection_workers: 4
  epochs: 20
  samples_per_batch: 128
  phase_loss_coefficient: 1.0

ppo:
  iterations: 30
  steps_per_rollout: 200
  rollouts_per_update: 1
  rollout_workers: 1
  update_epochs: 4
  transitions_per_batch: 2048
  action_samples_per_batch: 16384
  eval_every_iterations: 0
  eval_workers: 32
  save_every_iterations: 1

evaluation:
  policies: [learned, learned-greedy, max-pressure, queue, uniform-random, fixed-time]
  seeds: [8101, 8102, 8103, 8104, 8105, 8106]
  steps: 1800
  fixed_time_phase_duration: 10
  queue_pressure_phase_duration: 10
