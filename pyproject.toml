[project]
name = "gnn-traffic-signal-control"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "libsumo>=1.27,<1.28",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sumolib>=1.27,<1.28",
    "tensorboard>=2.16",
    "torch>=2.3",
    "torch-geometric>=2.5",
    "traci>=1.27,<1.28",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external infrastructure",
]
