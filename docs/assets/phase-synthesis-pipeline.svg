<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Conflict-derived traffic-signal phase synthesis</title>
  <desc id="desc">A four-panel diagram showing SUMO controlled links, atomic activation groups, a compatibility graph, and all maximal compatible sets converted to selectable green phases.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#27485d"/>
    </marker>
    <marker id="moveArrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
    <style>
      .title { font: 700 27px Inter,Segoe UI,Arial,sans-serif; fill:#18394d }
      .subtitle { font: 400 15px Inter,Segoe UI,Arial,sans-serif; fill:#577083 }
      .step { font: 700 14px Inter,Segoe UI,Arial,sans-serif; fill:#fff }
      .head { font: 700 20px Inter,Segoe UI,Arial,sans-serif; fill:#18394d }
      .body { font: 400 14px Inter,Segoe UI,Arial,sans-serif; fill:#415d70 }
      .small { font: 400 12px Inter,Segoe UI,Arial,sans-serif; fill:#577083 }
      .label { font: 700 13px Inter,Segoe UI,Arial,sans-serif; fill:#18394d }
      .phase { font: 700 15px ui-monospace,SFMono-Regular,Consolas,monospace; fill:#18394d }
      .panel { fill:#fff; stroke:#c8d8e2; stroke-width:1.4 }
      .road { fill:#dfe5e9 }
      .lane { fill:none; stroke:#fff; stroke-width:2.2; stroke-dasharray:8 7 }
      .link { fill:none; stroke-width:4; stroke-linecap:round; marker-end:url(#moveArrow) }
      .compat { fill:none; stroke:#7897a9; stroke-width:3 }
      .node { stroke:#fff; stroke-width:3 }
    </style>
  </defs>

  <rect width="1500" height="760" fill="#f7fafc"/>
  <text x="48" y="48" class="title">From controlled links to conflict-derived selectable phases</text>
  <text x="48" y="76" class="subtitle">The action set is synthesized once from SUMO link constraints; the policy later scores only these phases.</text>

  <!-- panel backgrounds -->
  <g>
    <rect x="42" y="112" width="330" height="600" rx="14" class="panel"/>
    <rect x="395" y="112" width="315" height="600" rx="14" class="panel"/>
    <rect x="733" y="112" width="315" height="600" rx="14" class="panel"/>
    <rect x="1071" y="112" width="387" height="600" rx="14" class="panel"/>
    <circle cx="68" cy="142" r="15" fill="#2879a7"/><text x="68" y="147" text-anchor="middle" class="step">1</text>
    <circle cx="421" cy="142" r="15" fill="#2879a7"/><text x="421" y="147" text-anchor="middle" class="step">2</text>
    <circle cx="759" cy="142" r="15" fill="#2879a7"/><text x="759" y="147" text-anchor="middle" class="step">3</text>
    <circle cx="1097" cy="142" r="15" fill="#2879a7"/><text x="1097" y="147" text-anchor="middle" class="step">4</text>
    <path d="M377 400 H389" stroke="#27485d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M715 400 H727" stroke="#27485d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1053 400 H1065" stroke="#27485d" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <!-- panel 1 -->
  <text x="96" y="149" class="head">Controlled links</text>
  <text x="66" y="178" class="body">Lane-to-lane links and request conflicts</text>
  <g transform="translate(207 355)">
    <rect x="-48" y="-148" width="96" height="296" rx="6" class="road"/>
    <rect x="-148" y="-48" width="296" height="96" rx="6" class="road"/>
    <rect x="-50" y="-50" width="100" height="100" fill="#cfd8dd"/>
    <path d="M-24 -148 V-55" class="lane"/><path d="M24 148 V55" class="lane"/>
    <path d="M-148 24 H-55" class="lane"/><path d="M148 -24 H55" class="lane"/>
    <!-- compatible major-flow atomic links g1-g3 -->
    <path d="M-18 -123 C-18 -40,-18 40,-18 119" class="link" stroke="#2879a7"/>
    <path d="M18 123 C18 40,18 -40,18 -119" class="link" stroke="#2879a7"/>
    <path d="M-123 18 C-65 18,-55 18,-42 18 C-8 18,20 5,38 -25 C54 -49,76 -60,119 -60" class="link" stroke="#2879a7" transform="translate(0 42)"/>
    <!-- protected-turn pair g4-g5 -->
    <path d="M-30 -119 C-30 -52,-12 -32,42 -25 C73 -21,91 -21,119 -21" class="link" stroke="#d98b00"/>
    <path d="M30 119 C30 52,12 32,-42 25 C-73 21,-91 21,-119 21" class="link" stroke="#d98b00"/>
    <g class="label">
      <circle cx="-30" cy="-105" r="13" fill="#2879a7"/><text x="-30" y="-100" text-anchor="middle" fill="#fff">g1</text>
      <circle cx="30" cy="105" r="13" fill="#2879a7"/><text x="30" y="110" text-anchor="middle" fill="#fff">g2</text>
      <circle cx="-105" cy="60" r="13" fill="#2879a7"/><text x="-105" y="65" text-anchor="middle" fill="#fff">g3</text>
      <circle cx="66" cy="-29" r="13" fill="#d98b00"/><text x="66" y="-24" text-anchor="middle" fill="#fff">g4</text>
      <circle cx="-66" cy="29" r="13" fill="#d98b00"/><text x="-66" y="34" text-anchor="middle" fill="#fff">g5</text>
    </g>
    <!-- conflict icon at center -->
    <circle cx="0" cy="0" r="18" fill="#fff" stroke="#c84c3d" stroke-width="2"/>
    <path d="M-7 -7 L7 7 M7 -7 L-7 7" stroke="#c84c3d" stroke-width="3"/>
  </g>
  <g transform="translate(70 564)">
    <rect width="274" height="82" rx="9" fill="#f1f6f9"/>
    <text x="14" y="23" class="label">Inputs from SUMO/netconvert</text>
    <text x="14" y="45" class="small">controlled-link indices · request “foes”</text>
    <text x="14" y="64" class="small">incoming/outgoing lanes · outgoing edges</text>
  </g>

  <!-- panel 2 -->
  <text x="449" y="149" class="head">Atomic groups</text>
  <text x="419" y="178" class="body">Links constrained to activate together</text>
  <g transform="translate(430 211)">
    <rect width="245" height="57" rx="10" fill="#e7f2f8" stroke="#9fc5d9"/>
    <circle cx="28" cy="29" r="15" fill="#2879a7"/><text x="28" y="34" text-anchor="middle" class="step">g1</text>
    <text x="55" y="24" class="label">North approach group</text><text x="55" y="43" class="small">links sharing activation constraints</text>
    <rect y="70" width="245" height="57" rx="10" fill="#e7f2f8" stroke="#9fc5d9"/>
    <circle cx="28" cy="99" r="15" fill="#2879a7"/><text x="28" y="104" text-anchor="middle" class="step">g2</text>
    <text x="55" y="94" class="label">South approach group</text><text x="55" y="113" class="small">parallel/shared-lane links retained</text>
    <rect y="140" width="245" height="57" rx="10" fill="#e7f2f8" stroke="#9fc5d9"/>
    <circle cx="28" cy="169" r="15" fill="#2879a7"/><text x="28" y="174" text-anchor="middle" class="step">g3</text>
    <text x="55" y="164" class="label">Compatible side flow</text><text x="55" y="183" class="small">one or more controlled links</text>
    <rect y="224" width="245" height="57" rx="10" fill="#fff4de" stroke="#e4bd6b"/>
    <circle cx="28" cy="253" r="15" fill="#d98b00"/><text x="28" y="258" text-anchor="middle" class="step">g4</text>
    <text x="55" y="248" class="label">Protected turn A</text><text x="55" y="267" class="small">conflicts with the major-flow set</text>
    <rect y="294" width="245" height="57" rx="10" fill="#fff4de" stroke="#e4bd6b"/>
    <circle cx="28" cy="323" r="15" fill="#d98b00"/><text x="28" y="328" text-anchor="middle" class="step">g5</text>
    <text x="55" y="318" class="label">Protected turn B</text><text x="55" y="337" class="small">compatible with protected turn A</text>
  </g>
  <g transform="translate(430 592)">
    <rect width="245" height="57" rx="9" fill="#fff0ed" stroke="#e8aaa1"/>
    <text x="14" y="23" class="label" fill="#9f372b">Reject internally conflicting groups</text>
    <text x="14" y="43" class="small">SUMO foes + different approaches merging</text>
  </g>

  <!-- panel 3 -->
  <text x="787" y="149" class="head">Compatibility graph</text>
  <text x="757" y="178" class="body">An edge means two atomic groups may be green</text>
  <g transform="translate(891 362)">
    <!-- maximum triangle -->
    <path d="M-82 -82 L82 -82 L0 46 Z" class="compat"/>
    <!-- smaller maximal pair -->
    <path d="M-56 160 L56 160" class="compat" stroke="#d98b00"/>
    <circle cx="-82" cy="-82" r="25" fill="#2879a7" class="node"/><text x="-82" y="-76" text-anchor="middle" class="step">g1</text>
    <circle cx="82" cy="-82" r="25" fill="#2879a7" class="node"/><text x="82" y="-76" text-anchor="middle" class="step">g2</text>
    <circle cx="0" cy="46" r="25" fill="#2879a7" class="node"/><text x="0" y="52" text-anchor="middle" class="step">g3</text>
    <circle cx="-56" cy="160" r="25" fill="#d98b00" class="node"/><text x="-56" y="166" text-anchor="middle" class="step">g4</text>
    <circle cx="56" cy="160" r="25" fill="#d98b00" class="node"/><text x="56" y="166" text-anchor="middle" class="step">g5</text>
    <path d="M-115 -115 H115 V80 H-115 Z" fill="none" stroke="#2879a7" stroke-width="2" stroke-dasharray="6 5" rx="10"/>
    <path d="M-94 125 H94 V196 H-94 Z" fill="none" stroke="#d98b00" stroke-width="2" stroke-dasharray="6 5" rx="10"/>
  </g>
  <g transform="translate(761 584)">
    <rect width="259" height="65" rx="9" fill="#f1f6f9"/>
    <text x="14" y="23" class="label">Bron–Kerbosch enumerates</text>
    <text x="14" y="43" class="body">every maximal clique</text>
    <text x="152" y="43" class="small">(up to 128)</text>
  </g>

  <!-- panel 4 -->
  <text x="1125" y="149" class="head">Selectable green phases</text>
  <text x="1095" y="178" class="body">Each maximal set becomes one local action</text>
  <g transform="translate(1102 213)">
    <rect width="325" height="177" rx="12" fill="#eaf5fa" stroke="#8cbdd4" stroke-width="1.5"/>
    <text x="18" y="30" class="label">Phase 1 · major-flow service</text>
    <text x="18" y="57" class="phase">{g1, g2, g3}</text>
    <g transform="translate(163 119)">
      <rect x="-22" y="-48" width="44" height="96" rx="4" class="road"/>
      <rect x="-80" y="-22" width="160" height="44" rx="4" class="road"/>
      <path d="M-9 -42 V42" stroke="#22a06b" stroke-width="4" marker-end="url(#moveArrow)"/>
      <path d="M9 42 V-42" stroke="#22a06b" stroke-width="4" marker-end="url(#moveArrow)"/>
      <path d="M-70 9 H70" stroke="#22a06b" stroke-width="4" marker-end="url(#moveArrow)"/>
    </g>
    <rect y="198" width="325" height="177" rx="12" fill="#fff5e5" stroke="#deb45b" stroke-width="1.5"/>
    <text x="18" y="228" class="label">Phase 2 · protected turns</text>
    <text x="18" y="255" class="phase">{g4, g5}</text>
    <g transform="translate(163 317)">
      <rect x="-22" y="-48" width="44" height="96" rx="4" class="road"/>
      <rect x="-80" y="-22" width="160" height="44" rx="4" class="road"/>
      <path d="M-9 -42 C-9 -10,12 -9,69 -9" fill="none" stroke="#d98b00" stroke-width="4" marker-end="url(#moveArrow)"/>
      <path d="M9 42 C9 10,-12 9,-69 9" fill="none" stroke="#d98b00" stroke-width="4" marker-end="url(#moveArrow)"/>
    </g>
    <rect y="397" width="325" height="95" rx="10" fill="#fff" stroke="#d5dee4"/>
    <text x="16" y="423" class="label">Why maximal, not only maximum?</text>
    <text x="16" y="447" class="body">The smaller protected-turn phase cannot</text>
    <text x="16" y="467" class="body">accept another compatible group, so it is</text>
    <text x="16" y="487" class="body">maximal and remains a selectable action.</text>
  </g>

  <text x="750" y="742" text-anchor="middle" class="small">Safety boundary: compatibility follows SUMO request-conflict (“foes”) data plus the explicit same-outgoing-edge merge rule.</text>
</svg>
